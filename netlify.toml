# Netlify configuration for the Tamrin landing site

[build]
  publish = "."

# Serve the Apple App Site Association file as JSON (required for Universal Links).
[[headers]]
  for = "/.well-known/apple-app-site-association"
  [headers.values]
    Content-Type = "application/json"
    Cache-Control = "public, max-age=3600"

# Long-cache static assets.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# The service worker must never be cached, or a fix to it waits for the cache
# to expire on every phone that has it.
[[headers]]
  for = "/app/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

# Admin dashboard: keep it out of search engines and out of caches.
# Note: this is not access control — the data itself is gated by Supabase Auth.
# Netlify matches header rules against the REQUEST path, not the rewritten
# target — so /admin needs its own rule or it inherits none of these.
[[headers]]
  for = "/admin"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow, noarchive"
    Cache-Control = "no-store"
    Referrer-Policy = "no-referrer"

[[headers]]
  for = "/admin.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow, noarchive"
    Cache-Control = "no-store"
    Referrer-Policy = "no-referrer"

# Admin dashboard: /admin serves the page without exposing the .html extension.
[[redirects]]
  from = "/admin"
  to = "/admin.html"
  status = 200

# Member web app (app/) — the member side of the iOS app, for Android and any
# other device without the app. On an iPhone with the app installed, Universal
# Links (/.well-known/apple-app-site-association) open the app before the
# browser ever asks for these paths; everywhere else the web app answers them.
# Netlify only applies a 200 rewrite when no file matches, so the app's own
# files under /app/ are still served as files.
[[redirects]]
  from = "/event/*"
  to = "/app/index.html"
  status = 200

[[redirects]]
  from = "/join/*"
  to = "/app/index.html"
  status = 200

# In-app screens (/app/team/…, /app/settings) are routes, not files.
[[redirects]]
  from = "/app/*"
  to = "/app/index.html"
  status = 200

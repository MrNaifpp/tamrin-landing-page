# Netlify configuration for the Tamrin landing site

[build]
  publish = "."

# Serve the Apple App Site Association file as JSON (required for Universal Links).
[[headers]]
  for = "/.well-known/apple-app-site-association"
  [headers.values]
    Content-Type = "application/json"
    Cache-Control = "public, max-age=3600"

# Long-cache static assets.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Admin dashboard: keep it out of search engines and out of caches.
# Note: this is not access control — the data itself is gated by Supabase Auth.
# Netlify matches header rules against the REQUEST path, not the rewritten
# target — so /admin needs its own rule or it inherits none of these.
[[headers]]
  for = "/admin"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow, noarchive"
    Cache-Control = "no-store"
    Referrer-Policy = "no-referrer"

[[headers]]
  for = "/admin.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow, noarchive"
    Cache-Control = "no-store"
    Referrer-Policy = "no-referrer"

# Admin dashboard: /admin serves the page without exposing the .html extension.
[[redirects]]
  from = "/admin"
  to = "/admin.html"
  status = 200

# Event deep links: when opened without the app, show the branded fallback page (HTTP 200).
[[redirects]]
  from = "/event/*"
  to = "/404.html"
  status = 200

# Workspace invite links: same branded fallback.
[[redirects]]
  from = "/join/*"
  to = "/404.html"
  status = 200
